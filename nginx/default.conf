server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La API vive detrás, en la misma red de Docker: el navegador solo ve este origen (sin CORS, cookie SameSite=Strict)
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 9m;     # archivos del cuadro: la API acepta hasta 8 MB
    proxy_read_timeout 60s;
  }

  # Archivos con huella en el nombre: no cambian nunca, el navegador los guarda un año
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Cualquier otra ruta es de la aplicación (Vue Router): se entrega index.html sin guardarlo en caché
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
