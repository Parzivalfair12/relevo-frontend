# Cabeceras de seguridad. Nginx no hereda add_header entre niveles: este archivo se incluye en cada location que define las suyas.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# La web carga sus propios scripts y estilos, las tipografías de Google Fonts (las pide el diseño aprobado) y habla solo con su origen.
# 'unsafe-inline' en estilos: Vue asigna estilos en línea a algunos elementos (barras, colores de servicio).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS lo pone quien termina el HTTPS (balanceador o proveedor); aquí se sirve por HTTP dentro de la red.
